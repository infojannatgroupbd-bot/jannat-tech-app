name: JANNAT TECH Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: rm -rf android && npx cap add android
      - run: npx capacitor-assets generate --android || true
      - run: cp -r native-res/android/res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk JANNAT-TECH.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JANNAT-TECH-Android-APK
          path: JANNAT-TECH.apk
